name: Data IHSG Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 17 * * *'

permissions:
  contents: read

concurrency:
  group: data-ihsg-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ vars.PAGES_ENABLED == 'true' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      MS_TENANT_ID: ${{ vars.MS_TENANT_ID }}
      MS_CLIENT_ID: ${{ vars.MS_CLIENT_ID }}
      MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
      ONEDRIVE_DRIVE_ID: ${{ vars.ONEDRIVE_DRIVE_ID }}
      ONEDRIVE_FOLDER_ID: ${{ vars.ONEDRIVE_FOLDER_ID }}
      INPUT_FOLDER: ${{ runner.temp }}/trading-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stage dashboard
        run: |
          mkdir site
          cp index.html presets.json dashboard.json.gz extra_metrics.json.gz site/
      - name: Update from OneDrive
        if: ${{ env.MS_CLIENT_SECRET != '' }}
        run: |
          python -m pip install 'openpyxl==3.1.5'
          python fetch_onedrive.py
          python build_data.py "$INPUT_FOLDER" site/dashboard.json.gz
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment

<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Draf dashboard harga IHSG, arus asing, screener, dan kepemilikan saham.">
<title>Data IHSG</title>
<style>
:root{color-scheme:dark;--bg:#0b1119;--panel:#121b27;--line:#253344;--ink:#eef3fa;--muted:#a0b0c3;--accent:#52e0bd;--blue:#7ba8ff;--negative:#ff8298;--radius:14px}
:root[data-theme="light"]{color-scheme:light;--bg:#f4f8fb;--panel:#fff;--line:#d8e3ed;--ink:#172c41;--muted:#4e647a;--accent:#007661;--negative:#a91b3d}
[data-theme="light"] header,[data-theme="light"] button,[data-theme="light"] input,[data-theme="light"] select{background:#fff}
[data-theme="light"] button[aria-pressed="true"]{background:#e1f4ee;border-color:#8bbfaf}
[data-theme="light"] .track{background:#dfe8f0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif}
.shell{max-width:1240px;margin:auto;padding:0 32px}
header{border-bottom:1px solid var(--line);background:#101823}
.top{min-height:72px;display:flex;align-items:center;gap:32px;flex-wrap:wrap}
.brand{font-size:19px;font-weight:750;letter-spacing:-.045em;white-space:nowrap}
.brand span{color:var(--accent)}
nav,.tabs,.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge,.stamp{color:var(--muted);font-size:12px}
.badge{margin-left:auto;border:1px solid var(--line);border-radius:20px;padding:5px 10px}
main{padding-top:30px!important;padding-bottom:56px!important}
h1,h2,p{margin:0}
h1{font-size:clamp(28px,4vw,41px);letter-spacing:-.055em;line-height:1.08}
h2{font-size:17px;letter-spacing:-.025em}
.intro{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:0 0 19px}
.intro p{color:var(--muted);margin-top:8px}
.tabs{margin:0 0 17px}
button,input,select{font:inherit;color:var(--ink);background:#111b28;border:1px solid var(--line);padding:8px 12px;border-radius:8px;max-width:100%}
button{cursor:pointer}
button:hover{border-color:var(--accent)}
button[aria-pressed="true"]{color:var(--accent);background:#17312f;border-color:#2d6259}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:14px}
.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.card{padding:16px}
.card small{color:var(--muted);display:block}
.card strong{display:block;font-size:clamp(19px,3vw,28px);letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.panel{padding:17px 19px;margin-bottom:13px}
.panelhead{display:flex;align-items:flex-start;justify-content:space-between;gap:9px;flex-wrap:wrap;margin-bottom:10px}
.panelhead .stamp{margin-top:3px}
.panel .controls{margin-bottom:14px}
.positive{color:var(--accent)}.negative{color:var(--negative)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font:14px "Segoe UI",sans-serif}
.chart .grid{stroke:var(--line);stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:7px 15px;color:var(--muted);font-size:12px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.rows{overflow:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;white-space:nowrap}
th,td{text-align:left;border-bottom:1px solid var(--line);padding:8px 12px}
th{color:var(--muted);font-size:12px;font-weight:600}
td button{padding:2px 8px}
summary{cursor:pointer;color:var(--muted)}
details{margin-top:14px}
.rule{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.rule input{width:130px}
.bars{display:grid;gap:9px;margin:8px 0}
.bar-row{display:grid;grid-template-columns:minmax(120px,1fr) minmax(110px,3fr) minmax(68px,auto);gap:9px;align-items:center}
.track{height:13px;background:#1d2938;border-radius:4px;position:relative;overflow:hidden}
.fill{height:100%;position:absolute;top:0;border-radius:3px}
.zero{height:100%;width:1px;position:absolute;left:50%;background:#96a8ba;z-index:1}
.bar-row span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);padding:12px 0}
dialog{max-width:min(92vw,610px);padding:22px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink)}
dialog::backdrop{background:#050911b0}
dialog textarea{width:100%;min-height:190px;margin:13px 0;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit}
@media(max-width:640px){.shell{padding-left:14px;padding-right:14px}.top{padding-top:11px;padding-bottom:11px;gap:9px 14px}.top nav{order:3;width:100%}.panel{padding:12px}.card{padding:9px}.cards{gap:6px}.bar-row{grid-template-columns:minmax(95px,1fr) minmax(65px,2fr) auto;font-size:12px}.chart text{font-size:21px}}
th{position:relative;overflow:hidden;text-overflow:ellipsis}
.rows table{width:max-content;min-width:100%;table-layout:fixed}
.rows td{overflow:hidden;text-overflow:ellipsis}
.resize{position:absolute;right:0;top:0;width:10px;height:100%;cursor:col-resize;touch-action:none;border-right:2px solid var(--line)}
.resize:hover,.resize:focus{border-color:var(--accent)}
.chart-wrap{position:relative}.chart-tip{position:absolute;pointer-events:none;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;z-index:2;font-size:12px;max-width:95%;white-space:pre-line}
.chart-hit{cursor:crosshair}.chart-hit:focus{outline:none;stroke:var(--ink);stroke-width:1}
.update-line{margin:-5px 0 14px}.stock-update{margin-top:7px}
#ai-fab{position:fixed;bottom:22px;right:24px;z-index:4;background:var(--accent);color:var(--bg);font-weight:750;border-radius:24px;box-shadow:0 4px 24px #0004}
#assessment{position:fixed;inset:auto 22px 74px auto;margin:0;width:min(420px,calc(100vw - 32px))}
#assessment .chat{max-height:310px;overflow:auto;white-space:pre-wrap;background:var(--bg);border-radius:9px;padding:12px;margin:12px 0}
.legend{margin-top:8px}
#assessment-connect[hidden]{display:none}
th,td{text-align:left}
.rows table{min-width:0;max-width:none;table-layout:fixed}
.rows th,.rows td{padding:0}
.rows th{overflow:visible}.rows td{overflow:hidden}
.cell{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:8px 10px}
th .cell button{display:block;min-width:0;width:100%;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;background:transparent;color:inherit;border:0;border-radius:0;padding:0;text-align:left;font:inherit}
.resize{z-index:1;width:10px;right:-4px}
.ownership-change{font-weight:750}
.neutral{color:#e6b950}
[data-theme="light"] .neutral{color:#906300}
.column-options{display:flex;flex-wrap:wrap;gap:7px 16px;padding:8px 0}
.column-options label{display:flex;align-items:center;gap:4px}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:12px;align-items:start}
.summary-grid section{margin:0}
.summary-grid dl{margin:0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px}
.summary-grid dd{margin:0;text-align:right;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.summary-grid dt{color:var(--muted)}
.cli-link{display:inline-block;color:var(--accent);margin-top:10px}
</style>
</head>
<body>
<header><div class="shell top">
  <div class="brand">Data <span>IHSG</span></div>
  <nav aria-label="Menu utama" id="navigation"></nav>
  <span class="badge" id="dataset-badge">Memuat data</span>
  <button id="theme" type="button">Light mode</button>
</div></header>
<main class="shell" id="app"></main>
<button id="ai-fab" type="button" data-action="ai" hidden>AI Assessment</button>
<dialog id="assessment" aria-labelledby="assessment-title">
  <h2 id="assessment-title">AI Assessment</h2>
  <div class="stamp" id="assessment-context"></div>
  <div class="chat" id="assessment-output" role="status" aria-live="polite"></div>
  <form class="controls" id="assessment-connect" hidden>
    <input type="password" id="assessment-token" aria-label="Token akses AI" placeholder="Token akses AI" autocomplete="off">
    <button>Analisis</button>
  </form>
  <div class="controls"><button id="copy">Salin konteks analisis</button><form method="dialog"><button>Tutup</button></form><span role="status" class="stamp" id="copied"></span></div>
</dialog>
<script>
"use strict";
const app = document.querySelector("#app");
const nav = document.querySelector("#navigation");
const assessment = document.querySelector("#assessment");
const locale = new Intl.NumberFormat("id-ID", { maximumFractionDigits: 2 });
const palette = ["#52e0bd","#7ba8ff","#ae98f6","#ffd280","#ff8298","#71cadf"];
const format = value => Number.isFinite(value) ? locale.format(value) : "—";
const integer = value => Number.isFinite(value) ? new Intl.NumberFormat("id-ID",{maximumFractionDigits:0}).format(value) : "—";
const signed = value => (value > 0 ? "+" : "") + format(value);
const decimal2 = new Intl.NumberFormat("id-ID",{minimumFractionDigits:2,maximumFractionDigits:2});
const pct = value => Number.isFinite(value) ? decimal2.format(value)+"%" : "—";
const pp = value => Number.isFinite(value) ? (value>0?"+":"")+decimal2.format(value) : "—";
const moneyT = value => "Rp " + format(value) + " T";
const tone = value => value < 0 ? "negative" : "positive";
const escape = value => String(value ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const sources = {};
const metrics = {
  cap: ["Market cap", moneyT], weight: ["Bobot IHSG", pct], price:["Harga", x => "Rp " + format(x)],
  free:["Free float", pct], foreign:["Perubahan asing 1M (pp)", signed],
  pe:["P/E (×)", format], pbv:["P/BV (×)", format], yield:["Dividend yield", pct],
  hsc:["HSC", x => x ? "Ya" : "Tidak"], sector:["Sektor", x => x]
};
let presetRules = {};
let market = [];
const owners = {own5:[],own1:[]};
let catalogue = [];
let screenRows = [];
let screenPeriods = {};
const actual = new Set();
const screenMetrics = {};
const aliases = new Map();
const view = {page:"ihsg", screen:"single", detail:"summary", ticker:"BBRI", range:"3M", cum:false, metric:"Weight to IHSG", order:"desc", value:"", rules:[], preset:"", ownerSearch:"", origin:"", status:"", balanceUnit:"pct", investorOrigin:"",offset:0};
const screens = {single:"Single Criteria",custom:"Custom Screener",own5:"Kepemilikan 5%",own1:"Kepemilikan 1%"};
const details = {summary:"Summary",balance:"Balance Position",investor:"Investor Type",own5:"Kepemilikan 5%",own1:"Kepemilikan 1%"};
const pages = {ihsg:"IHSG",screen:"Screener",detail:"Stock Detail",cli:"IDX CLI"};
const metricOptions = entries => Object.fromEntries(entries.map(([key, info]) => [key, info[0]]));
function select(field, options, value, label) {
  return `<select data-field="${field}" aria-label="${label}">${Object.entries(options).map(([key,name]) =>
    `<option value="${escape(key)}"${String(value) === key ? " selected" : ""}>${escape(name)}</option>`).join("")}</select>`;
}
function tabs(options, key, active) {
  return Object.entries(options).map(([id,label]) =>
    `<button type="button" data-action="${key}" data-value="${id}" aria-pressed="${active === id}">${label}</button>`).join("");
}
function updateLine(source, cls="") {
  const date = sources[source]?.update;
  const update = date ? new Intl.DateTimeFormat("id-ID",{dateStyle:"medium",timeStyle:"short",timeZone:"Asia/Jakarta"}).format(new Date(date))+" WIB" : "—";
  return `<div class="stamp ${cls}">Last update ${update}</div>`;
}
function panel(title, source, body) {
  const show = view.page==="screen" && source ? updateLine(source) : "";
  return `<section class="panel"><div class="panelhead"><h2>${title}</h2>${show}</div>${body}</section>`;
}
function heading(title, subtitle, controls = "") {
  return `<div class="intro"><div><h1 tabindex="-1">${title}</h1><div class="intro-subtitle">${subtitle}</div></div><div class="controls">${controls}</div></div>`;
}
function cards(items) {
  return `<div class="cards">${items.map(([label,value,source,style = ""]) =>
    `<div class="card"><small>${label}</small><strong class="${style}">${value}</strong></div>`).join("")}</div>`;
}
const columnWidths = new Map();
const tableSorts = new Map();
const hiddenColumns = {own5:new Set(),own1:new Set()};
const plain = html => String(html).replace(/<[^>]*>/g,"").replace(/&(?:amp|lt|gt|quot|#39);/g,"x");
const compare = (a,b,order) => {
  if(a==null || b==null)return Number(a==null)-Number(b==null);
  const d=typeof a==="number"&&typeof b==="number"?a-b:String(a).localeCompare(String(b),"id",{numeric:true});
  return order==="asc"?d:-d;
};
function table(head, body, id="", keys=head, sort=tableSorts.get(id)) {
  if (!body.length) return '<p class="empty">Tidak ada hasil untuk filter ini.</p>';
  const measure=document.createElement?.("canvas").getContext("2d");
  const widths=head.map((label,i)=>{
    if(columnWidths.has(id+"|"+keys[i]))return columnWidths.get(id+"|"+keys[i]);
    if(measure)measure.font="600 12px Inter, sans-serif";
    let size=(measure?.measureText(plain(label)).width??plain(label).length*8)+40;
    if(measure)measure.font="14px Inter, sans-serif";
    for(const row of body){
      const text=plain(row[i]);
      size=Math.max(size,(measure?.measureText(text).width??text.length*8)+24+(String(row[i]).includes("<button")?18:0));
    }
    return Math.ceil(size);
  });
  const cols = widths.map(width=>`<col style="width:${width}px">`).join("");
  const headers=head.map((col,i)=>{
    const key=keys[i];
    const active=sort?.key===key;
    const control=id && key!=="No."?`<button type="button" data-action="sort" data-table="${id}" data-value="${escape(key)}">${col}${active?(sort.order==="asc"?" ↑":" ↓"):""}</button>`:col;
    return `<th scope="col" data-column="${escape(id+"|"+key)}"${active?` aria-sort="${sort.order==="asc"?"ascending":"descending"}"`:""}><span class="cell">${control}</span><span class="resize" role="separator" aria-label="Lebar kolom" aria-orientation="vertical" tabindex="0"></span></th>`;
  }).join("");
  return `<div class="rows"><table style="width:${widths.reduce((a,b)=>a+b,0)}px"><colgroup>${cols}</colgroup><thead><tr>${headers}</tr></thead><tbody>${body.map(row=>`<tr>${row.map(value=>`<td><span class="cell">${value}</span></td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function resizeColumn(handle, width) {
  const header=handle.parentElement;
  const grid=header.closest("table");
  const cols=[...grid.querySelectorAll("col")];
  const size=Math.max(0,Math.round(width));
  cols[header.cellIndex].style.width=size+"px";
  grid.style.width=cols.reduce((total,col)=>total+parseFloat(col.style.width),0)+"px";
  columnWidths.set(header.dataset.column,size);
}
app.addEventListener("pointerdown",event=>{
  const handle=event.target.closest(".resize");
  if (!handle) return;
  event.preventDefault();
  event.stopPropagation();
  handle.setPointerCapture(event.pointerId);
  const start=event.clientX, width=handle.parentElement.getBoundingClientRect().width;
  const move=e=>resizeColumn(handle,width+e.clientX-start);
  handle.addEventListener("pointermove",move);
  handle.addEventListener("lostpointercapture",()=>handle.removeEventListener("pointermove",move),{once:true});
});
app.addEventListener("keydown",event=>{
  if (!event.target.matches(".resize") || !["ArrowLeft","ArrowRight"].includes(event.key)) return;
  event.preventDefault();
  resizeColumn(event.target,event.target.parentElement.getBoundingClientRect().width+(event.key==="ArrowLeft"?-12:12));
});
function ticker(code) {
  return `<button data-action="ticker" data-value="${escape(code)}">${escape(code)}</button>`;
}
function hbars(values, formatter, diverging = false) {
  if (!values.length) return '<p class="empty">Tidak ada hasil untuk filter ini.</p>';
  const max = Math.max(...values.map(row => Math.abs(row[1]))) || 1;
  return `<div class="bars">${values.map(([label, value, html]) => {
    const width = Math.abs(value / max) * (diverging ? 50 : 100);
    const left = diverging ? (value < 0 ? 50-width : 50) : 0;
    return `<div class="bar-row"><span>${html || escape(label)}</span><div class="track" aria-hidden="true">${diverging ? '<div class="zero"></div>' : ''}<div class="fill" style="left:${left}%;width:${width}%;background:${value < 0 ? palette[4] : palette[0]}"></div></div><span>${formatter(value)}</span></div>`;
  }).join("")}</div>`;
}
const dateLabel = date => new Intl.DateTimeFormat("id-ID",{dateStyle:"medium",timeZone:"UTC"}).format(new Date(date+"T00:00:00Z"));
function plotFrame(points, legends, mode, unit, fixedMax) {
  const width=1020,height=260,left=74,right=mode==="flow"?948:1000,top=18,bottom=220;
  const step=(right-left)/points.length;
  const x=i=>left+(i+.5)*step;
  const valid=points.flatMap(p=>mode==="flow"?[p.values[0]]:p.values).filter(Number.isFinite);
  if (!valid.length) return '<p class="empty">Data tidak tersedia untuk periode ini.</p>';
  const low=(mode==="line"||mode==="candle")&&fixedMax==null?Math.min(...valid):Math.min(0,...valid);
  const high=fixedMax??Math.max(...valid,mode==="flow"?0:low);
  const span=high-low||1;
  const y=v=>bottom-(v-low)*(bottom-top)/span;
  const fmt=value=>unit==="%"?pct(value):(unit==="poin"?integer(value):format(value))+(unit?" "+unit:"");
  const axisFmt=value=>unit==="%"?integer(value)+"%":integer(value);
  const flowValues=mode==="flow"?points.map(p=>p.values[1]).filter(Number.isFinite):[];
  const flowLow=Math.min(0,...flowValues),flowHigh=Math.max(0,...flowValues);
  const zero=(0-low)/span;
  const below=Math.max(-flowLow,0),above=Math.max(flowHigh,0);
  // The zero lines remain aligned on the two independent flow axes.
  const cumulativeSpan=Math.max(zero>0?below/zero:0,zero<1?above/(1-zero):0,1);
  const opposite=mode==="flow"&&(zero===0&&below>0||zero===1&&above>0);
  const cLow=opposite?flowLow:-zero*cumulativeSpan;
  const cSpan=opposite?(flowHigh-flowLow||1):cumulativeSpan;
  const cy=v=>bottom-(v-cLow)*(bottom-top)/cSpan;
  const axis=Array.from({length:5},(_,i)=>low+i*span/4).map((v,i)=>`<line class="grid" x1="${left}" x2="${right}" y1="${y(v)}" y2="${y(v)}"/><text x="${left-8}" y="${y(v)+4}" text-anchor="end">${axisFmt(v)}</text>${mode==="flow"?`<text x="${right+8}" y="${y(v)+4}">${axisFmt(cLow+i*cSpan/4)}</text>`:""}`).join("");
  const monthly=mode==="stack"&&points.some(p=>p.raw);
  const labels=monthly?points.map((_,i)=>i):[...new Set([0,.25,.5,.75,1].map(v=>Math.round((points.length-1)*v)))];
  const dates=labels.map(i=>{
    const date=points[i].date;
    const label=monthly?new Intl.DateTimeFormat("id-ID",{month:"short",year:"2-digit",timeZone:"UTC"}).format(new Date(date+"T00:00:00Z")):date.slice(5);
    return `<text x="${x(i)}" y="245" text-anchor="middle">${label}</text>`;
  }).join("");
  let shape="";
  if(mode==="candle"){
    const half=Math.min(9,step*.34);
    shape=points.map(({values:[open,high,low,close]},i)=>{
      if(!Number.isFinite(close))return "";
      const hasOpen=Number.isFinite(open);
      const color=hasOpen?(close===open?"#b88413":close>open?"#179c64":"#d84753"):"var(--muted)";
      const wick=Number.isFinite(high)&&Number.isFinite(low)?
        `<line x1="${x(i)}" x2="${x(i)}" y1="${y(high)}" y2="${y(low)}" stroke="${color}" stroke-width="1.3"/>`:"";
      const body=hasOpen?
        `<rect x="${x(i)-half}" y="${Math.min(y(open),y(close))}" width="${2*half}" height="${Math.max(1.4,Math.abs(y(close)-y(open)))}" fill="${color}"/>`:
        `<line x1="${x(i)}" x2="${x(i)+half}" y1="${y(close)}" y2="${y(close)}" stroke="${color}" stroke-width="1.6"/>`;
      return `<g class="${hasOpen?"candle":"close-tick"}">${wick}${body}</g>`;
    }).join("");
  }else if(mode==="line"){
    shape=legends.map((_,n)=>{
      let previous=false;
      const d=points.map((p,i)=>{
        const value=p.values[n];
        if(!Number.isFinite(value)){previous=false;return "";}
        const command=previous?"L":"M";previous=true;
        return command+x(i)+","+y(value);
      }).join(" ");
      const color=legends[n][1];
      const dots=points.map((p,i)=>Number.isFinite(p.values[n])?`<circle cx="${x(i)}" cy="${y(p.values[n])}" r="1.8" fill="${color}"/>`:"").join("");
      return `<path d="${d}" fill="none" stroke="${color}" stroke-width="2.4"/>${dots}`;
    }).join("");
  }else if(mode==="bar"||mode==="flow"){
    shape=points.map((p,i)=>{const v=p.values[0];return Number.isFinite(v)?`<rect x="${x(i)-step*.33}" y="${Math.min(y(0),y(v))}" width="${step*.66}" height="${Math.abs(y(v)-y(0))}" fill="${v<0?palette[4]:palette[0]}"/>`:"";}).join("");
    if(mode==="flow"){
      const path=points.map((p,i)=>Number.isFinite(p.values[1])?`${x(i)},${cy(p.values[1])}`:"").filter(Boolean).join(" ");
      shape+=`<polyline points="${path}" fill="none" stroke="${legends[1][1]}" stroke-width="2.7" vector-effect="non-scaling-stroke"/>`;
    }
  }else{
    shape=points.map((p,i)=>{
      if(!p.values.every(Number.isFinite))return "";
      let total=0;
      return p.values.map((v,n)=>{
        const prev=total;total+=v;
        const label=dateLabel(p.date)+" · "+legends[n][0]+": "+fmt(v)+(p.raw?" · "+format(p.raw[n])+" saham":"");

    if (!op || input.trim() === "") return true;
    let value = stock[key];

    const raw = input.trim();
    const parsed = Number(/^[+-]?\d{1,3}(,\d{3})+(\.\d+)?$/.test(raw) ? raw.replaceAll(",","") : raw.replace(",","."));
    if (typeof value === "boolean") value = Number(value);
    if (typeof value === "string" && /^(yes|no|true|false)$/i.test(value)) {
      if (raw === "1" || raw === "0") value = Number(/^(yes|true)$/i.test(value));
    }
    const target = typeof value === "number" ? (/^(yes|no|true|false)$/i.test(raw) ? Number(/^(yes|true)$/i.test(raw)) : parsed) : raw.toLowerCase();
    if (typeof value === "number" && !Number.isFinite(target)) return false;
    if (typeof value === "string") value = value.toLowerCase();
    return ({">":() => value>target,">=":() => value>=target,"<=":() => value<=target,"!=":() => value!==target,"≥":() => value>=target,"<":() => value<target,"≤":() => value<=target,"=":() => value===target,"≠":() => value!==target})[op]?.() ?? false;
  });
}

      ([ticker,nama,asal,jenis,porsiSekarang,porsiDulu,status,sahamSekarang,sahamDulu])=>
      ({ticker,nama,asal,jenis,porsiSekarang,porsiDulu,status,sahamSekarang,sahamDulu}))}];
  }));
  const context={tab:inDetail?"Stock Detail":"Screener",subtab:sub,ticker:code||null,
    kriteria:!inDetail&&sub==="custom"?view.rules:null,jumlahHasil:rows.length,
    saham:rows.slice(0,12).map(row=>({ticker:row.code,...Object.fromEntries(keys.map(k=>[k,row[k]??null]))})),
    perubahanKepemilikan:byThreshold};
  const request=++assessmentRequest;
  assessmentPrompt="Ringkas temuan utama berdasarkan angka dan periode ini. Bedakan perubahan porsi dan jumlah saham, dan jelaskan jika data tidak tersedia.\n\n"+JSON.stringify(context,null,2);
  document.querySelector("#assessment-context").textContent=code?"Stock Detail · "+code:"Screener · "+(screens[sub]||sub);
  document.querySelector("#copied").textContent="";
  const out=document.querySelector("#assessment-output");
  const connect=document.querySelector("#assessment-connect");
  connect.hidden=!assessmentEndpoint || !!assessmentToken;
  out.textContent=assessmentEndpoint?(assessmentToken?"Menganalisis snapshot…":"Masukkan token akses layanan AI."):
    "Layanan Gemini belum terhubung. Konteks Screener / Stock Detail, termasuk laporan 5% dan 1%, siap disalin.";
  if(!assessment.open) assessment.show();
  if(!assessmentEndpoint||!assessmentToken)return;
  try{
    const response=await fetch(assessmentEndpoint,{
      method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+assessmentToken},
      body:JSON.stringify({context}),signal:AbortSignal.timeout(25000)
    });
    if(response.status===401 && request===assessmentRequest){assessmentToken="";connect.hidden=false;}
    if(!response.ok)throw Error("AI endpoint");
    const {text}=await response.json();
    if(typeof text!=="string" || !text.trim())throw Error("AI result");
    if(request===assessmentRequest)out.textContent=text;
  }catch{
    if(request===assessmentRequest)out.textContent="Gemini belum bisa diakses. Konteks analisis tetap bisa disalin.";
  }
}
function changeField(field,value) {
  view.offset = 0;
  if(field==="metric"||field==="order"||field==="preset")tableSorts.delete("screener");
  const [,rulePart,ruleIndex] = field.split("-");
  if (field.startsWith("rule-")) {
    view.rules[Number(ruleIndex)][{key:0,op:1,input:2}[rulePart]] = value;
    view.preset = "";
  } else if (field === "preset") {
    view.preset = value;
    view.rules = (presetRules[value] || []).map(([key,op,amount])=>[aliases.get(key.toLowerCase())||key,op,amount]);
  } else {
    view[field] = value;
    if (field==="metric") view.value="";
  }
}
app.addEventListener("input", event => {
  const {field} = event.target.dataset;
  if (event.target.matches("input") && field) changeField(field,event.target.value);
});
app.addEventListener("change", event => {
  const {owner,column}=event.target.dataset;
  if(owner){
    const index=Number(column);
    if(event.target.checked)hiddenColumns[owner].delete(index);
    else if(hiddenColumns[owner].size<ownershipHeaders.length-1)hiddenColumns[owner].add(index);
    view.openColumns=owner;
    render();
    app.querySelector(`[data-owner="${owner}"][data-column="${index}"]`)?.focus();
    return;
  }
  if (!event.target.matches("select")) return;
  const {field} = event.target.dataset;
  changeField(field,event.target.value);
  render(field);
});
app.addEventListener("keydown", event => {
  if (event.key==="Enter" && event.target.matches("input")) render(event.target.dataset.field);
});
document.addEventListener("click", async event => {
  const button = event.target.closest("button");
  if (!button) return;
  if (button.id === "copy") {

    try {
      await navigator.clipboard.writeText(assessmentPrompt);
      document.querySelector("#copied").textContent = "Prompt disalin.";
    } catch {
      document.querySelector("#assessment-output").textContent=assessmentPrompt;
      document.querySelector("#copied").textContent="Pilih teks untuk menyalin.";
    }
    return;
  }
  const {action,value} = button.dataset;
  if (!action) return;
  if (action === "ai") { showAssessment(); return; }
  if(action==="sort"){
    const id=button.dataset.table;
    const previous=tableSorts.get(id) || (id==="screener"?{key:view.metric,order:view.order}:null);
    tableSorts.set(id,{key:value,order:previous?.key===value&&previous.order==="desc"?"asc":"desc"});
    view.offset=0;
    render();
    [...app.querySelectorAll("[data-action=sort]")].find(target=>target.dataset.table===id&&target.dataset.value===value)?.focus();
    return;
  }
  if (action === "page") view.page=value;
  if (["page","screen","apply","remove"].includes(action)) view.offset=0;
  if (action === "next") view.offset+=100;
  if (action === "prev") view.offset=Math.max(0,view.offset-100);
  if (action === "screen") { view.screen=value; view.ownerSearch=""; view.origin=""; view.status=""; }
  if (action === "detail") { view.detail=value; view.ownerSearch=""; view.origin=""; view.status=""; }
  if (action === "ticker") { view.ticker=value; view.page="detail"; view.detail="summary"; }
  if (action === "add") { view.rules.push(["Market Cap",">",""]); view.preset=""; }
  if (action === "remove") { view.rules.splice(Number(value),1); view.preset=""; }
  render();
  if (action === "page" || action === "ticker") app.querySelector("h1").focus();
  else if (action === "add") app.querySelector(`[data-field="rule-key-${view.rules.length-1}"]`).focus();
  else app.querySelector(`[data-action="${action}"]${value ? `[data-value="${CSS.escape(value)}"]` : ""}`)?.focus();
});
const theme = document.querySelector("#theme");
function applyTheme(value) {
  document.documentElement.dataset.theme=value;
  theme.textContent=value==="light"?"Dark mode":"Light mode";
}
try { applyTheme(localStorage.getItem("ihsg-theme") || "dark"); } catch { applyTheme("dark"); }
theme.addEventListener("click",()=>{
  const next=document.documentElement.dataset.theme==="light"?"dark":"light";
  applyTheme(next);
  try { localStorage.setItem("ihsg-theme",next); } catch {}
});
async function loadDashboard() {
  const badge=document.querySelector("#dataset-badge");
  market=[];
  presetRules={};
  try {
    const documents=await Promise.all(["dashboard.json.gz","presets.json","extra_metrics.json.gz","market.json?schema=ohlc","details.json.gz","summary.json.gz"].map(async url=>{
      const response=await fetch(url);
      if (!response.ok) throw Error(url);
      if (url.endsWith(".gz")) return new Response(response.body.pipeThrough(new DecompressionStream("gzip"))).json();
      return response.json();
    }));
    const [data,presets,extras,marketData,detailsData,summaryData]=documents;
    presetRules=presets;
    market=marketData.rows;
    owners.own5=data.own5 || [];
    owners.own1=data.own1 || [];
    catalogue=data.catalogue || [];
    screenRows=(data.screen || []).map(row=>({...row,
      ...Object.fromEntries(Object.entries(extras[row.code]||{}).filter(([key])=>row[key]==null))}));
    screenPeriods=data.screenerPeriods || {};
    balanceByTicker=detailsData.balance || {};
    investorByTicker=detailsData.investor || {};
    summaries=summaryData.stocks||{};
    for (const [key,source] of Object.entries(data.sources)) {
      sources[key]=source;
      actual.add(key);
    }
    sources.market={update:marketData.update};
    sources.balance={update:detailsData.balanceUpdate};
    sources.investor={update:detailsData.investorUpdate,period:detailsData.periods?.join(" / ")};
    fetch("ai-config.json").then(r=>r.ok?r.json():{}).then(config=>{
      if(typeof config.endpoint==="string" && config.endpoint.startsWith("https://"))assessmentEndpoint=config.endpoint;
    }).catch(()=>{});
    for (const [name,, , ,shape] of catalogue) {
      aliases.set(name.toLowerCase(),name);
      screenMetrics[name]=[name,value=>value==null?"—":typeof value==="number"?(String(shape??"").includes("%")?pct(value*100):format(value)):escape(value)];
    }
    for (const criterion of new Set(Object.values(extras).flatMap(Object.keys))) {
      if(aliases.has(criterion.toLowerCase()))continue;
      screenMetrics[criterion]=[criterion,value=>value==null?"—":/%|Ratio|Progress/.test(criterion)?pct(value*100):format(value)];
      aliases.set(criterion.toLowerCase(),criterion);
    }
    for (const key of Object.values(presets).flat().map(rule=>rule[0])) {
      const canonical=aliases.get(key.toLowerCase());
      if (!canonical) {
        screenMetrics[key]=[key,value=>value==null?"—":escape(value)];
        aliases.set(key.toLowerCase(),key);
      }
    }
    badge.textContent="Snapshot data";
  } catch {
    badge.textContent="Data belum tersedia";
  }
  render();
}
loadDashboard();
</script>
